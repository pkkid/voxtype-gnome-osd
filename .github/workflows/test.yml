name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Type check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # glib-compile-schemas, for the settings schema test.
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin
      - run: npm ci
      - run: npm test
